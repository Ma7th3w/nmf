<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>3PL 업체 Q&A 관리</title>
<style>
  :root{ --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e2e5ea; --accent:#1e5eff; --ok:#1f8a4c; --danger:#c62828; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; line-height:1.5}
  header{background:#fff; border-bottom:1px solid var(--line); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; gap:10px}
  h1{margin:0; font-size:18px} h1 small{color:var(--muted); font-weight:500; font-size:12px; margin-left:8px}
  main{max-width:1100px; margin:0 auto; padding:16px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px}
  input, textarea, select{font:inherit; font-size:15px; padding:10px; border:1px solid #cfd4dc; border-radius:8px; outline:none; width:100%; background:#fff; color:var(--ink)}
  textarea{min-height:110px; resize:vertical}
  .btn{font:inherit; font-size:14px; font-weight:800; padding:9px 14px; border:0; border-radius:8px; cursor:pointer; background:var(--accent); color:#fff}
  .btn.sub{background:#fff; color:var(--accent); border:1px solid var(--accent)}
  .btn.danger{background:#fff; color:var(--danger); border:1px solid var(--danger)}
  .btn:disabled{opacity:.5; cursor:default}
  .bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px} .bar .sp{flex:1}
  .badge{display:inline-block; font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; background:#e5e7eb; color:#374151}
  .badge.ok{background:#dcfce7; color:#166534} .badge.wait{background:#fef3c7; color:#92400e} .badge.faq{background:#dbeafe; color:#1e40af}
  .item{border-left:6px solid #c9ced6; padding:12px 14px; border-radius:8px; background:#fafafa; margin-bottom:10px}
  .item.wait{border-left-color:#f59e0b} .item.done{border-left-color:var(--ok)}
  .item .top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
  .item .q{white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; font-weight:700; margin:8px 0}
  .item .a{white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; background:#eef3ff; padding:10px; border-radius:6px; margin:8px 0}
  .item .act{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center}
  .item .act label{font-size:13px; display:flex; gap:4px; align-items:center}
  #login{max-width:420px; margin:60px auto}
  .err{color:var(--danger); font-size:14px; margin-top:8px}
  .faqitem{border-bottom:1px solid var(--line); padding:10px 0} .faqitem:last-child{border-bottom:0}
  .faqitem .fq{font-weight:800} .faqitem .fa{white-space:pre-wrap; color:#374151; margin-top:4px}
  .hidden{display:none}
  @media (max-width:640px){ main{padding:10px} }
</style>
</head>
<body>
<header>
  <h1>3PL 업체 Q&A 관리<small id="who"></small></h1>
  <div><button class="btn sub" id="logout" style="display:none">로그아웃</button></div>
</header>

<main>
  <div id="login" class="card">
    <h2 style="margin:0 0 12px; font-size:16px">관리자 로그인</h2>
    <input id="email" type="email" placeholder="이메일(아이디)" autocomplete="username">
    <div style="height:8px"></div>
    <input id="pass" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn" style="width:100%; margin-top:12px">로그인</button>
  </div>

  <div id="app" class="hidden">
    <div class="bar">
      <span class="badge wait" id="nWait">대기 0</span>
      <span class="badge ok" id="nDone">답변 0</span>
      <span class="badge faq" id="nFaq">FAQ 0</span>
      <span class="sp"></span>
      <select id="filter" style="width:auto"><option value="wait" selected>답변 대기만</option><option value="done">답변 완료만</option><option value="all">전체</option></select>
      <button class="btn sub" id="dlBtn">엑셀로 다운로드</button>
    </div>

    <div class="card">
      <h2 style="margin:0 0 10px; font-size:16px">질문 목록</h2>
      <div id="list"><div style="color:var(--muted)">불러오는 중…</div></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 10px; font-size:16px">FAQ (업체 페이지에 공개)</h2>
      <div id="faqList"><div style="color:var(--muted)">없음</div></div>
      <details style="margin-top:12px" open><summary style="cursor:pointer; font-weight:700">FAQ 직접 등록</summary>
        <input id="fq" placeholder="질문 (공개용 문구)" style="margin-top:8px">
        <textarea id="fa" placeholder="답변" style="margin-top:8px"></textarea>
        <button class="btn" id="faqAdd" style="margin-top:8px">FAQ에 올리기</button>
      </details>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyA0y8IR9HWuh11IYfMa8eWh57GCSgI5IjQ",
    authDomain: "nmfnmf-9e3e0.firebaseapp.com",
    databaseURL: "https://nmfnmf-9e3e0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nmfnmf-9e3e0",
    storageBucket: "nmfnmf-9e3e0.firebasestorage.app",
    messagingSenderId: "758942522691",
    appId: "1:758942522691:web:92a7d3eace6e3c568a63f6"
  });
  const db = firebase.database(), auth = firebase.auth();
  const $ = id => document.getElementById(id);
  function esc(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function when(ts){ const d=new Date(ts||0); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }

  // ── 로그인 (Firebase Authentication 이메일/비밀번호. 사용자는 콘솔에서 만든다) ──
  $('loginBtn').onclick = async () => {
    $('loginErr').textContent='';
    try{ await auth.signInWithEmailAndPassword($('email').value.trim(), $('pass').value); }
    catch(e){ $('loginErr').textContent='로그인 실패: '+(e.code||e.message); }
  };
  $('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') $('loginBtn').click(); });
  $('logout').onclick = () => auth.signOut();
  auth.onAuthStateChanged(u => {
    const on=!!u;
    $('login').classList.toggle('hidden', on); $('app').classList.toggle('hidden', !on);
    $('logout').style.display = on?'inline-block':'none'; $('who').textContent = on?u.email:'';
    if(on) start(); else stop();
  });

  // ── 데이터 ──
  let threads={}, faqs={}, tRef=null, fRef=null;
  function start(){
    tRef=db.ref('threads'); fRef=db.ref('faq');
    tRef.on('value', s=>{ threads=s.val()||{}; render(); }, e=>{ $('list').innerHTML='<div class="err">읽기 권한이 없습니다. database.rules.json의 ADMIN_UID가 이 계정의 UID인지 확인하세요. ('+esc(e.code||e.message)+')</div>'; });
    fRef.on('value', s=>{ faqs=s.val()||{}; renderFaq(); });
  }
  function stop(){ tRef&&tRef.off(); fRef&&fRef.off(); threads={}; faqs={}; }
  $('filter').onchange = render;

  function rows(){
    const out=[];
    Object.entries(threads).forEach(([key,t])=>Object.entries((t&&t.items)||{}).forEach(([qid,it])=>out.push({key, qid, company:(t&&t.company)||'', ...it})));
    return out.sort((a,b)=>(b.ts||0)-(a.ts||0));
  }
  function render(){
    const all=rows(); const nWait=all.filter(r=>!r.a).length;
    $('nWait').textContent='대기 '+nWait; $('nDone').textContent='답변 '+(all.length-nWait);
    const f=$('filter').value;
    const shown=all.filter(r=> f==='all' || (f==='wait' ? !r.a : !!r.a));
    if(!shown.length){ $('list').innerHTML='<div style="color:var(--muted)">해당하는 질문이 없습니다.</div>'; return; }
    $('list').innerHTML = shown.map(r => `<div class="item ${r.a?'done':'wait'}" data-key="${esc(r.key)}" data-qid="${esc(r.qid)}">
        <div class="top"><span><b>${esc(r.company)}</b>${r.faqId?' <span class="badge faq">FAQ</span>':''}</span><span>${esc(when(r.ts))} ${r.a?'<span class="badge ok">답변 '+esc(when(r.ats))+'</span>':'<span class="badge wait">대기</span>'}</span></div>
        <div class="q">${esc(r.q||'')}</div>
        <textarea class="ta" placeholder="${r.a?'답변 수정':'답변 작성'}">${r.a?esc(r.a):''}</textarea>
        <div class="act">
          <button class="btn save">${r.a?'답변 수정 저장':'답변 저장'}</button>
          <label><input type="checkbox" class="tofaq" ${r.faqId?'disabled checked':''}> FAQ에도 올리기(질문 문구는 공개용으로 다듬어 저장)</label>
          <span style="flex:1"></span>
          <button class="btn danger del">삭제</button>
        </div>
      </div>`).join('');
  }

  $('list').addEventListener('click', async e => {
    const item=e.target.closest('.item'); if(!item) return;
    const key=item.dataset.key, qid=item.dataset.qid;
    const t=threads[key]||{}, it=(t.items||{})[qid]||{};
    if(e.target.classList.contains('save')){
      const a=item.querySelector('.ta').value.trim();
      if(a.length<2) return alert('답변을 입력해 주세요.');
      e.target.disabled=true;
      try{
        await db.ref('threads/'+key+'/items/'+qid).update({a, ats: firebase.database.ServerValue.TIMESTAMP});
        if(item.querySelector('.tofaq').checked && !it.faqId){
          const fq=prompt('FAQ에 올릴 질문 문구 (업체명·특정 정보는 빼고 공개용으로)', it.q||'');
          if(fq!==null && fq.trim()){
            const ref=db.ref('faq').push();
            await ref.set({q:fq.trim(), a, ts: firebase.database.ServerValue.TIMESTAMP});
            await db.ref('threads/'+key+'/items/'+qid).update({faqId: ref.key});
          }
        }
      }catch(err){ alert('저장 실패: '+(err.code||err.message)); }
      finally{ e.target.disabled=false; }
    }
    if(e.target.classList.contains('del')){
      if(!confirm((t.company||'')+' 업체의 이 질문을 삭제할까요? 업체도 더 이상 볼 수 없습니다.')) return;
      try{ await db.ref('threads/'+key+'/items/'+qid).remove(); }
      catch(err){ alert('삭제 실패: '+(err.code||err.message)); }
    }
  });

  // ── FAQ ──
  function renderFaq(){
    const list=Object.entries(faqs).map(([id,f])=>({id,...f})).sort((a,b)=>(b.ts||0)-(a.ts||0));
    $('nFaq').textContent='FAQ '+list.length;
    $('faqList').innerHTML = list.length ? list.map(f=>`<div class="faqitem" data-id="${esc(f.id)}">
      <div class="fq">Q. ${esc(f.q||'')}</div><div class="fa">${esc(f.a||'')}</div>
      <div class="act" style="margin-top:6px"><button class="btn sub fedit">수정</button> <button class="btn danger fdel">내리기</button></div>
    </div>`).join('') : '<div style="color:var(--muted)">없음</div>';
  }
  $('faqList').addEventListener('click', async e => {
    const it=e.target.closest('.faqitem'); if(!it) return; const id=it.dataset.id, f=faqs[id]||{};
    try{
      if(e.target.classList.contains('fdel')){ if(confirm('이 FAQ를 내릴까요?')) await db.ref('faq/'+id).remove(); }
      if(e.target.classList.contains('fedit')){
        const q=prompt('질문', f.q||''); if(q===null) return;
        const a=prompt('답변', f.a||''); if(a===null) return;
        await db.ref('faq/'+id).update({q:q.trim(), a:a.trim()});
      }
    }catch(err){ alert('실패: '+(err.code||err.message)); }
  });
  $('faqAdd').onclick = async () => {
    const q=$('fq').value.trim(), a=$('fa').value.trim();
    if(!q||!a) return alert('질문과 답변을 모두 입력해 주세요.');
    try{ await db.ref('faq').push({q, a, ts: firebase.database.ServerValue.TIMESTAMP}); $('fq').value=''; $('fa').value=''; }
    catch(err){ alert('실패: '+(err.code||err.message)); }
  };

  // ── 엑셀 ──
  $('dlBtn').onclick = () => {
    const btn=$('dlBtn'); btn.disabled=true; btn.textContent='만드는 중…';
    const run = () => {
      const data=[['업체명','질문시각','질문','답변','답변시각','FAQ']];
      rows().reverse().forEach(r=>data.push([r.company, when(r.ts), r.q||'', r.a||'', r.ats?when(r.ats):'', r.faqId?'O':'']));
      const ws=XLSX.utils.aoa_to_sheet(data); ws['!cols']=[{wch:18},{wch:18},{wch:60},{wch:60},{wch:18},{wch:6}];
      const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'QA');
      const t=new Date(), p=n=>String(n).padStart(2,'0');
      XLSX.writeFile(wb, '3PL_업체QA_'+t.getFullYear()+p(t.getMonth()+1)+p(t.getDate())+'_'+p(t.getHours())+p(t.getMinutes())+'.xlsx');
      btn.disabled=false; btn.textContent='엑셀로 다운로드';
    };
    if(window.XLSX) return run();
    const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=run; sc.onerror=()=>{ alert('엑셀 모듈을 불러오지 못했습니다.'); btn.disabled=false; btn.textContent='엑셀로 다운로드'; };
    document.head.appendChild(sc);
  };
</script>
</body>
</html>
